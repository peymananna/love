<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>our story ❤️</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lalezar&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Lalezar', cursive;
      background: linear-gradient(135deg, #1f1c2c, #928DAB);
      background-size: 300% 300%;
      animation: gradient 20s ease infinite;
      color: #fff;
      text-align: center;
      min-height: 100vh;
      padding-bottom: 100px;
      overflow-x: hidden;
    }

    @keyframes gradient {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    h1 {
      font-size: 50px;
      margin-top: 30px;
      color: #fff;
      text-shadow: 0 0 25px rgba(255, 192, 203, 0.8);
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 40px;
      gap: 25px;
    }

    .image-box {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 8px 30px rgba(255, 105, 180, 0.2);
      backdrop-filter: blur(12px);
      transition: transform 0.3s ease, box-shadow 0.3s;
      cursor: pointer;
      width: 240px;
    }

    .image-box:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 40px rgba(255, 105, 180, 0.3);
    }

    .image-box img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 12px;
    }

    .date-box {
      margin-top: 10px;
      font-size: 16px;
      color: #fce4ec;
      text-shadow: 0 0 5px rgba(0, 0, 0, 0.4);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.4);
    }

    .go-home, .play-music {
      position: fixed;
      bottom: 20px;
      padding: 12px 28px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      z-index: 20;
      background: linear-gradient(to right, #ff4b2b, #ff416c);
      color: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      transition: transform 0.2s ease;
    }

    .go-home:hover, .play-music:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(255,105,180,0.4);
    }

    .go-home {
      left: 50%;
      transform: translateX(-50%);
    }

    .play-music {
      left: 20px;
    }

    @media (max-width: 768px) {
      h1 { font-size: 36px; }
      .image-box { width: 180px; }
      .image-box img { height: 180px; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 26px; }
      .image-box { width: 150px; }
      .image-box img { height: 150px; }
      .go-home, .play-music { font-size: 14px; padding: 10px 20px; }
    }
  </style>
</head>
<body>

  <h1>❤️ Our Beautiful Story ❤️</h1>

  <div class="gallery" id="gallery">
    <!-- تصاویر به صورت داینامیک اضافه می‌شن -->
  </div>

  <div id="imageModal" class="modal" onclick="closeModal()">
    <img id="modalImg" src="">
  </div>

  <button class="go-home" onclick="window.location.href='index.html'">بازگشت به خانه</button>
  <button class="play-music" onclick="playMusic()">🎵 پخش موزیک</button>
  <audio id="bgMusic" loop>
    <source src=".//song4.mp3" type="audio/mpeg">
    مرورگر شما پشتیبانی نمی‌کند.
  </audio>

  <script>
    const images = [
      "PHOTO-2025-02-25-10-49-01.jpg",
      "IMAGE 2025-06-15 14:26:54.jpg",
      "IMAGE 2025-06-15 14:26:59.jpg",
      "IMAGE 2025-06-15 14:27:03.jpg",
      "IMAGE 2025-06-15 14:27:11.jpg",
      "IMAGE 2025-06-15 14:27:15.jpg",
      "IMAGE 2025-06-15 14:27:19.jpg",
      "IMAGE 2025-06-15 14:27:28.jpg",
      "IMAGE 2025-06-15 14:27:33.jpg",
      "IMAGE 2025-06-15 14:27:37.jpg"
    ];

    const gallery = document.getElementById("gallery");

    function toJalali(gy, gm, gd) {
      const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
      let jy = (gy <= 1600) ? 0 : 979;
      gy -= (gy <= 1600) ? 621 : 1600;
      let gy2 = (gm > 2) ? (gy + 1) : gy;
      let days = (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99)/100) + Math.floor((gy2 + 399)/400) - 80 + gd + g_d_m[gm - 1];
      jy += 33 * Math.floor(days / 12053);
      days %= 12053;
      jy += 4 * Math.floor(days / 1461);
      days %= 1461;
      if (days > 365) {
        jy += Math.floor((days - 1)/365);
        days = (days - 1)%365;
      }
      const jm = (days < 186) ? 1 + Math.floor(days/31) : 7 + Math.floor((days - 186)/30);
      const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186)%30));
      return {jy, jm, jd};
    }

    images.forEach(src => {
      const box = document.createElement("div");
      box.className = "image-box";
      box.onclick = () => openModal(src);

      const img = document.createElement("img");
      img.src = "./" + src;
      img.alt = "us ❤️";

      const dateBox = document.createElement("div");
      dateBox.className = "date-box";

      const match = src.match(/(\d{4})-(\d{2})-(\d{2})/);
      if (match) {
        const [_, y, m, d] = match;
        const sh = toJalali(parseInt(y), parseInt(m), parseInt(d));
        dateBox.textContent = `${sh.jy}/${String(sh.jm).padStart(2, '0')}/${String(sh.jd).padStart(2, '0')}`;
      } else {
        dateBox.textContent = "تاریخ نامشخص";
      }

      box.appendChild(img);
      box.appendChild(dateBox);
      gallery.appendChild(box);
    });

    function openModal(imageSrc) {
      let modal = document.getElementById("imageModal");
      let modalImg = document.getElementById("modalImg");
      modal.style.display = "flex";
      modalImg.src = imageSrc;
    }

    function closeModal() {
      document.getElementById("imageModal").style.display = "none";
    }

    function playMusic() {
      const music = document.getElementById("bgMusic");
      music.play();
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") closeModal();
    });
  </script>
</body>
</html>
